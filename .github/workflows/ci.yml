name: CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/ci.yml"
      - ".github/scripts/**"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/ci.yml"
      - ".github/scripts/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # fmt/clippy 不需要 Postgres，獨立一個 job 與測試並行，也能更早回報 lint 失敗
  backend-lint:
    name: Backend (fmt, clippy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      # rustup installs the toolchain pinned in backend/rust-toolchain.toml
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: backend
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  # 相依套件已知漏洞；豁免清單與理由在 backend/.cargo/audit.toml
  backend-audit:
    name: Backend (cargo audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-audit
      - run: cargo audit

  backend:
    name: Backend (test, coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      CARGO_TERM_COLOR: always
      DATABASE_URL: postgres://socrates:socrates@localhost:5432/socrates
    steps:
      # 測試用拋棄式 Postgres：關 fsync、資料放 tmpfs。sqlx::test 每個測試都建一個資料庫並跑全部 migration，
      # 瓶頸是磁碟同步；services: 無法傳 -c 參數，所以改用步驟啟動。先在背景起來，與下面的工具安裝並行暖機。
      - name: Start Postgres (no fsync, tmpfs)
        working-directory: .
        run: |
          docker run -d --name pg --tmpfs /var/lib/postgresql/data:rw \
            -e POSTGRES_USER=socrates -e POSTGRES_PASSWORD=socrates -e POSTGRES_DB=socrates \
            -p 127.0.0.1:5432:5432 postgres:16 \
            -c fsync=off -c synchronous_commit=off -c full_page_writes=off \
            -c max_connections=600 -c shared_buffers=1GB -c checkpoint_timeout=1h -c max_wal_size=8GB
      - uses: actions/checkout@v7
      # rustup installs the toolchain pinned in backend/rust-toolchain.toml
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: backend
      - run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - name: Wait for Postgres
        working-directory: .
        run: |
          for i in $(seq 1 60); do docker exec pg pg_isready -U socrates && exit 0; sleep 2; done
          docker logs pg; exit 1
      # 取代 `cargo test`：nextest 讓各測試檔並行執行（cargo test 是一個檔案接一個檔案），
      # 同時量測覆蓋率；目前只報告，不設門檻（見 docs/specs/decisions.md）。
      # 整合測試用 sqlx::test，每個測試各自一個資料庫，可安全並行。
      - run: cargo llvm-cov nextest --locked --lcov --output-path lcov.info
      - run: |
          {
            echo '### Backend coverage'
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: backend-lcov
          path: backend/lcov.info

  frontend:
    name: Frontend (lint, typecheck, test, build, e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # 點擊測試、三寬度截圖與 axe（S-11.6）。在官方 Playwright Docker image 裡跑（版本跟著 @playwright/test），
      # 與本機 `npm run test:e2e:linux` 產生基準截圖的環境完全相同；Vite dev server＋MSW，不需要後端。
      - name: Playwright (click, screenshot, axe)
        run: npm run test:e2e:linux
      - name: Upload Playwright report, traces and screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

  scripts:
    name: Scripts (project-status tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: .github/scripts/project-status.test.sh
