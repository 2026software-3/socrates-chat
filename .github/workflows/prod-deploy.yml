name: Production deploy (msi_cubi)

# 推送到 deploy/msi-cubi-intel（通常是從 deploy/msi-cubi-staging 開 PR 合併）時，msi_cubi 上的 self-hosted runner
# 透過 sudo 呼叫 root 部署包裝腳本，更新 NTNU 正式環境（compose 專案 socrates-ntnu）。
# - runner 由主機主動連到 GitHub，不需要對外開任何 port。
# - runner 使用者 gha-runner-prod（與 staging 的 gha-runner 不同人）不在 docker 群組。它只能執行
#   /usr/local/sbin/socrates-prod-deploy <sha>（見 sudoers），部署邏輯與 .env 都在主機上 root 擁有的檔案中，不取自這個 commit。
# - 包裝腳本只會部署 deploy/msi-cubi-intel 目前的 head；舊 commit 與分支外的 commit 會被拒絕（回滾由 root 手動）；
#   部署前先 pg_dump 備份，備份失敗就中止。
# - 信任邊界：能 push 到 deploy/msi-cubi-intel 的人，仍可以讓 app 原始碼與 Dockerfile 在主機上被建置並執行，
#   所以真正的防線是分支保護（只能經 PR）與 environment 的人工核准（見 docs/ntnu-ops.md §4「信任邊界與 GitHub 設定」）。
# - 這個 job 掛在 environment `prod-deploy` 下，該 environment 要設 Required reviewers，
#   並把 deployment branch 限制為 deploy/msi-cubi-intel。
on:
  push:
    branches: [deploy/msi-cubi-intel]

permissions:
  contents: read

# 同一時間只跑一個部署；部署中途不取消（避免 compose 被打斷），排隊中的舊執行會被較新的取代。
concurrency:
  group: prod-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production to msi_cubi
    environment: prod-deploy
    runs-on: [self-hosted, linux, msi-cubi-prod]
    timeout-minutes: 45
    steps:
      - name: Deploy production (root wrapper via sudo)
        env:
          DEPLOY_SHA: ${{ github.sha }}
        # 不 checkout：部署腳本與 .env 都在主機上，不執行 workspace 裡來自 commit 的程式。
        run: sudo -n /usr/local/sbin/socrates-prod-deploy "$DEPLOY_SHA"
