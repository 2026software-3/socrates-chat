name: Staging deploy (msi_cubi)

# 推送到 deploy/msi-cubi-staging 時，在 msi_cubi 上的 self-hosted runner 更新 staging（socrates-staging）。
# - runner 由主機主動連到 GitHub，不需要對外開任何 port；staging 網址經同一條 Cloudflare Tunnel。
# - 只接 push 事件、只接這一條分支：fork 的 PR 不會跑在這台機器上。
# - 這個 workflow 檔只在 deploy/msi-cubi-staging 上生效（push 事件用的是被推送 commit 裡的 workflow 定義）。
# - 設定與故障排除見 docs/ntnu-ops.md 的「staging 自動部署」。
on:
  push:
    branches: [deploy/msi-cubi-staging]

permissions:
  contents: read

# 同一時間只跑一個部署；部署中途不取消（避免 compose 被打斷），排隊中的舊執行會被較新的取代。
concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy staging to msi_cubi
    runs-on: [self-hosted, linux, msi-cubi-staging]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Deploy to staging
        env:
          STAGING_DIR: ${{ vars.STAGING_DEPLOY_DIR }}
          DEPLOY_SHA: ${{ github.sha }}
        # STAGING_DIR 沒設定（空字串）時，腳本會用 $HOME/socrates-staging
        run: scripts/deploy-staging.sh "$DEPLOY_SHA"
