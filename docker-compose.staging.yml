# msi_cubi 上的 staging 環境（2026-11-17 起）：只有 app＋db＋proxy，不接語音（沒有 cascade／Whisper／TTS），資料是空庫加合成資料。
# 與正式環境（專案 socrates-ntnu）完全獨立：專案名 socrates-staging、自己的 db volume（socrates-staging_pgdata_staging）、
# 自己的網路；獨立檔案，不疊在 docker-compose.yml 上。
# 使用（在 ~/socrates-intel，要有 .env.staging，不進版控）：
#   docker compose -f docker-compose.staging.yml up -d --no-build
# 對外：網址 https://staging.se3socrateschat.ntnu.cc，經 Cloudflare for SaaS 進**同一條** tunnel（正式環境的 cloudflared，
# remote ingress 加 hostname → http://staging-proxy:80）。只有 staging-proxy 加入正式環境的網路（別名 staging-proxy），
# 讓既有的 cloudflared 連得到；staging-app、staging-db 只在自己的網路。服務名刻意不叫 app／db／proxy，
# 否則 staging-proxy 同時在兩個網路時，Docker DNS 會把 app 解析到正式環境的容器。
# 正式環境（socrates-ntnu）沒在跑時 staging-proxy 起不來（網路不存在）。
# AI key 在介面設定（系統 AI、教師 key），不再有 .apikeylist；SMTP 與客訴信箱都不設（不寄信）。
# DEMO_MODE 只在匯入合成資料時用 STAGING_DEMO_MODE=true 開一次（見 docs/ntnu-ops.md），平常保持 false。
name: socrates-staging

services:
  staging-db:
    image: postgres:16
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_USER: socrates
      POSTGRES_PASSWORD: socrates
      POSTGRES_DB: socrates
    volumes:
      - pgdata_staging:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socrates"]
      interval: 2s
      timeout: 3s
      retries: 15

  staging-app:
    image: socrates-ntnu-app:${STAGING_APP_IMAGE_TAG:?請在專案目錄的 .env（不是 .env.staging）設定 STAGING_APP_IMAGE_TAG，值為預覽版自己的 image tag（不可沿用正式版的 cutover-20261117）}
    restart: unless-stopped
    mem_limit: 768m
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"
    env_file:
      - path: .env.staging
        required: true
    environment:
      DATABASE_URL: postgres://socrates:socrates@staging-db:5432/socrates
      RUN_MIGRATIONS: "true"
      APP_BASE_URL: ${STAGING_PUBLIC_URL:-https://staging.se3socrateschat.ntnu.cc}
      COOKIE_SECURE: "true"
      TRUSTED_PROXIES: 172.16.0.0/12
      DEMO_MODE: ${STAGING_DEMO_MODE:-false}
    # 固定位址：Pingap 沿用 DNS 記錄的 TTL（Docker 內建 DNS 是 600 秒），staging-app 換 IP 時代理要很久才跟上（S-16）。
    # 位址固定在獨立的 edge 網路（只有 staging-app 與 staging-proxy），其他容器只從下方 ip_range 配置，不會佔用這個位址。
    # 這樣 default 網路（staging-db 在上面）不必為了固定位址而重建，db 不會被停（2026-11-20 設計，見 docs/ntnu-ops.md）。
    networks:
      default: {}
      edge:
        ipv4_address: 172.29.252.10
    depends_on:
      staging-db:
        condition: service_healthy

  staging-proxy:
    # Pingap（Rust、Cloudflare Pingora；S-16，2026-11-19 由 nginx 改採）；版本固定，升級前要重跑 scripts/verify-proxy.sh。
    image: vicanso/pingap:0.16.2
    command: ["pingap", "-c", "/opt/pingap/pingap.toml"]
    restart: unless-stopped
    mem_limit: 64m
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"
    volumes:
      - ./docker/proxy/pingap.staging.toml:/opt/pingap/pingap.toml:ro
      - ./docker/proxy/down.html:/opt/pingap/down.html:ro
    ports:
      - "127.0.0.1:${STAGING_PROXY_PORT:-3081}:80"
    # 只接 edge（解析 staging-app 得到固定位址）與正式環境的網路（讓 cloudflared 連得到）；不接 default，不需要連 staging-db。
    networks:
      edge: {}
      ntnu:
        aliases: [staging-proxy]
    # 映像沒有 wget／curl，用 bash 內建的 TCP 連線打 /proxy-health
    healthcheck:
      test:
        - "CMD"
        - "bash"
        - "-c"
        - "exec 3<>/dev/tcp/127.0.0.1/80 && printf 'GET /proxy-health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ' 200 ' <&3"
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  # default：staging-db 與 staging-app 之間的網路，2026-11-19 套用過，設定不能再動，否則 compose 會重建它並停掉 staging-db。
  # 下面的標籤與網段是當時留下的（標籤用來觸發重建、量測中斷時間，PR #644），移除任何一項都會讓 compose 判定設定有變。
  default:
    labels:
      net-rev: "2"
    ipam:
      config:
        - subnet: 172.29.251.0/24
          ip_range: 172.29.251.128/25
  # edge：staging-app 固定在 172.29.252.10（S-16），staging-proxy 在這裡解析它；其他容器只從 ip_range 配置。
  # 正式環境的 edge 用 172.29.250.0/24；各網段不能重疊（staging default 251、staging edge 252）。
  edge:
    ipam:
      config:
        - subnet: 172.29.252.0/24
          ip_range: 172.29.252.128/25
  ntnu:
    external: true
    name: socrates-ntnu_default

volumes:
  pgdata_staging:
