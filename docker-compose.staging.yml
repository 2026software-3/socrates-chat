# msi_cubi 上的 staging 環境（2026-11-17 起）：只有 app＋db＋proxy，不接語音（沒有 cascade／Whisper／TTS），資料是空庫加合成資料。
# 與正式環境（專案 socrates-ntnu）完全獨立：專案名 socrates-staging、自己的 db volume（socrates-staging_pgdata_staging）、
# 自己的網路；獨立檔案，不疊在 docker-compose.yml 上。
# 使用（在 ~/socrates-intel，要有 .env.staging 與 .apikeylist，兩者不進版控）：
#   docker compose -f docker-compose.staging.yml up -d --no-build
# 對外：網址 https://staging.se3socrateschat.ntnu.cc，經 Cloudflare for SaaS 進**同一條** tunnel（正式環境的 cloudflared，
# remote ingress 加 hostname → http://staging-proxy:80）。只有 staging-proxy 加入正式環境的網路（別名 staging-proxy），
# 讓既有的 cloudflared 連得到；staging-app、staging-db 只在自己的網路。服務名刻意不叫 app／db／proxy，
# 否則 staging-proxy 同時在兩個網路時，Docker DNS 會把 app 解析到正式環境的容器。
# 正式環境（socrates-ntnu）沒在跑時 staging-proxy 起不來（網路不存在）。
# 這個環境會用同一份 .apikeylist（吃正式環境同一個每日免費額度），SMTP 與客訴信箱都不設（不寄信）。
# DEMO_MODE 只在匯入合成資料時用 STAGING_DEMO_MODE=true 開一次（見 docs/ntnu-ops.md），平常保持 false。
name: socrates-staging

services:
  staging-db:
    image: postgres:16
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_USER: socrates
      POSTGRES_PASSWORD: socrates
      POSTGRES_DB: socrates
    volumes:
      - pgdata_staging:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socrates"]
      interval: 2s
      timeout: 3s
      retries: 15

  staging-app:
    image: socrates-ntnu-app:${STAGING_APP_IMAGE_TAG:-cutover-20261117}
    restart: unless-stopped
    mem_limit: 768m
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"
    env_file:
      - path: .env.staging
        required: true
    environment:
      DATABASE_URL: postgres://socrates:socrates@staging-db:5432/socrates
      RUN_MIGRATIONS: "true"
      OPENAI_API_KEYS_FILE: /run/secrets/apikeylist
      APP_BASE_URL: ${STAGING_PUBLIC_URL:-https://staging.se3socrateschat.ntnu.cc}
      COOKIE_SECURE: "true"
      TRUSTED_PROXIES: 172.16.0.0/12
      DEMO_MODE: ${STAGING_DEMO_MODE:-false}
    secrets:
      - apikeylist
    depends_on:
      staging-db:
        condition: service_healthy

  staging-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    mem_limit: 64m
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"
    volumes:
      - ./docker/proxy/staging.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/proxy/proxy-pass.conf:/etc/nginx/proxy-pass.conf:ro
      - ./docker/proxy/down.html:/usr/share/nginx/down/down.html:ro
    ports:
      - "127.0.0.1:${STAGING_PROXY_PORT:-3081}:80"
    networks:
      default: {}
      ntnu:
        aliases: [staging-proxy]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/proxy-health"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  ntnu:
    external: true
    name: socrates-ntnu_default

secrets:
  apikeylist:
    file: ./.apikeylist

volumes:
  pgdata_staging:
