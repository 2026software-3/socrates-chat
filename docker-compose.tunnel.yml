# Cloudflare Tunnel（正式環境的對外入口）。疊在正式環境的其他 compose 檔上（見 docker-compose.msi-prod.yml）：
#   docker compose -f docker-compose.yml -f docker-compose.intel.yml -f docker-compose.msi-prod.yml -f docker-compose.tunnel.yml \
#     --profile app --profile cascade --profile proxy --profile tunnel up -d
# 前置：Cloudflare Zero Trust → Networks → Tunnels 的遠端 ingress（見 docs/ntnu-ops.md §2）：
#   se3socrateschat.ntnu.cc、socrates.ray-dev.stream → http://proxy:80；staging.se3socrateschat.ntnu.cc → http://staging-proxy:80
# （cloudflared 與 proxy 都在 edge 網路上，所以用服務名 proxy。）
# token 放不進版控的 .env：CLOUDFLARE_TUNNEL_TOKEN=...（不要寫進這個檔案）。
# 後端 TRUSTED_PROXIES 維持 172.16.0.0/12：Cloudflare 邊緣帶來真實來源，proxy 追加 cloudflared 容器位址，
# 後端由右往左跳過受信任代理。APP_BASE_URL 由 .env 的 APP_PUBLIC_URL 設定（https://se3socrateschat.ntnu.cc），
# 換網址時 Google OAuth 的 redirect URI 也要同步（使用者自己改）。
services:
  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:${CLOUDFLARED_TAG:-latest}
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    # default：連 staging-proxy 等其他接在這個網路上的容器；edge：連 proxy（proxy 只在 edge 上）。
    networks:
      default: {}
      edge: {}
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?設定 .env 的 CLOUDFLARE_TUNNEL_TOKEN}
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "3"
    depends_on:
      proxy:
        condition: service_started
        required: false
