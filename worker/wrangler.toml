# 試行版：Cloudflare Workers（Free）＋ Hyperdrive ＋ Supabase PostgreSQL。規格仍是 Rust/Axum/PostgreSQL，
# 且 AGENTS.md 不引入 Supabase；這個部署是需求方同意的試行例外，只用於評估，只放合成資料。說明見 worker/README.md。
name = "socrates-chat-trial-pg"
main = "build/index.js"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

[build]
command = "worker-build --release"

# 資料庫：Hyperdrive 連到 Supabase 的直連位址（db.<ref>.supabase.co:5432）；schema 用 backend/migrations。
# 本機 `wrangler dev` 可用 localConnectionString 指向 Docker Compose 的 PostgreSQL（加 sslmode=disable）。
[[hyperdrive]]
binding = "DB"
id = "7034a6b5476b44c9b2b1d191b69898c8"

# 前端（frontend/dist）由 Workers Assets 提供；API 與健康檢查先交給 Worker。
# SPA 路由找不到檔案時回 index.html。
[assets]
directory = "../frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/health", "/ready"]

# 回收卡住的總結（PostgreSQL 版在啟動與背景工作中執行），並碰一下資料庫，避免 Supabase 免費專案因一週沒活動被暫停。
[triggers]
crons = ["*/10 * * * *"]

[observability]
enabled = true

# 非機密設定；機密（OPENAI_API_KEYS、GOOGLE_CLIENT_SECRET、ADMIN_INITIAL_PASSWORD）用 `wrangler secret put`。
[vars]
APP_BASE_URL = "https://socrates-chat-trial-pg.example.workers.dev"
COOKIE_SECURE = "true"
DEMO_MODE = "true"
OPENAI_MODEL = "gpt-4.1-mini" # 沿用 .env.example 的暫定值；正式模型待 S-03.4 決定
GOOGLE_CLIENT_ID = "unset"
