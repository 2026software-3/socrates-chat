<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="30">
  <meta name="robots" content="noindex">
  <title>系統維護中 · Under maintenance · En mantenimiento</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", "Noto Sans TC", sans-serif;
      background: #f6f6f4; color: #1d1d1b;
    }
    main { width: 100%; max-width: 28rem; margin: 1rem; padding: 2rem; border: 1px solid #d8d8d4; border-radius: 12px; background: #fff; }
    h1 { margin: 0 0 1rem; font-size: 1.5rem; font-weight: 600; }
    p { margin: 0 0 .75rem; }
    p:last-child { margin-bottom: 0; }
    p + p { color: #5c5c58; font-size: .9rem; }
    @media (prefers-color-scheme: dark) {
      body { background: #151514; color: #ecece8; }
      main { background: #1d1d1b; border-color: #3a3a37; }
      p + p { color: #a5a5a0; }
    }
  </style>
</head>
<body>
  <main>
    <h1>系統維護中，請稍後再試</h1>
    <p lang="en">The system is under maintenance. Please try again later.</p>
    <p lang="es">El sistema está en mantenimiento. Inténtalo de nuevo más tarde.</p>
  </main>
</body>
</html>
