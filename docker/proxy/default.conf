# 反向代理（S-16）：把請求轉給 compose 內的 app:3000；後端連不上時回靜態停機說明頁（503）。
# 代理只講 HTTP：HTTPS 由 Windows 端的 Tailscale Funnel 處理。代理不做登入、不快取、不改內容。

# 用 Docker 內建 DNS，並在每次請求時才解析 app。這樣 app 容器停掉或尚未建立時，nginx 照常啟動，
# 請求得到 502 → 停機頁；app 回來後不必重啟代理。
resolver 127.0.0.11 valid=5s ipv6=off;

# 升級請求（語音 WebSocket）才帶 Connection: upgrade，其餘維持 close
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 上游（Funnel）已經帶了協定就保留，沒有才用代理自己看到的
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# 存取日誌只記必要欄位：不含查詢字串（OAuth 的 code、state）、Cookie、Referer、User-Agent
log_format safe '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent ${request_time}s';

server {
    listen 80;
    server_name _;
    server_tokens off;

    access_log /dev/stdout safe;
    error_log  /dev/stderr warn;

    # 後端自己限制本文大小（一般 1 MiB、語音上傳 10 MiB）；代理稍微放寬，讓超過時由後端回標準錯誤
    client_max_body_size 11m;

    # 代理自己的存活檢查：不依賴後端
    location = /proxy-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        set $backend http://app:3000;
        include /etc/nginx/proxy-pass.conf;
        # 一般請求最多等多久才算後端沒反應；比 AI 回覆的產生時間（AI_TOTAL_TIMEOUT_SECS 預設 60 秒）長很多
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 語音 WebSocket：長時間連線，閒置也不要被代理切斷
    location ~ ^/api/conversations/[^/]+/voice$ {
        set $backend http://app:3000;
        include /etc/nginx/proxy-pass.conf;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 只處理代理自己產生的錯誤（連線被拒、解析不到 app、逾時 → 502／504），回 503 停機頁。
    # 後端自己回的任何狀態（包含維護模式的 503）不攔截，原樣轉發。
    error_page 502 504 =503 /down.html;

    location = /down.html {
        internal;
        root /usr/share/nginx/down;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "30" always;
    }
}
