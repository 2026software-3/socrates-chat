# NTNU 正式環境在 msi_cubi 上的疊加檔（2026-11-17 起取代 Windows 端的 docker-compose.ntnu.yml）。
# 使用（在 ~/socrates-intel）：
#   F="-f docker-compose.yml -f docker-compose.intel.yml -f docker-compose.msi-prod.yml -f docker-compose.tunnel.yml"
#   docker compose $F --profile app --profile cascade --profile proxy --profile tunnel up -d --no-build
# .env 與 .apikeylist 不進版控；.env 要有 CASCADE_INTEL_TAG、APP_IMAGE_TAG、CLOUDFLARE_TUNNEL_TOKEN、CASCADE_LLM_TOKEN。
# 沒有 DEMO_MODE（測試堆疊的 browser-test/compose.yml 才有，不可對公網開放）。
# 資料庫放命名 volume pgdata_v2；搬遷前的備份在 Windows 端 ~/ntnu-backups/，舊資料在 Windows 的 volume 與
# msi_cubi 測試堆疊的 socrates-intel-test_pgdata（留作退路，不要 down -v）。
name: socrates-ntnu

services:
  db:
    ports: !override []
    volumes: !override
      - pgdata_v2:/var/lib/postgresql/data
    restart: unless-stopped
  app:
    image: socrates-ntnu-app:${APP_IMAGE_TAG:?設定 APP_IMAGE_TAG}
    build: !reset null
    restart: unless-stopped
    environment:
      # 學生實際開啟的網址，也是 CSRF Origin 檢查的對象。2026-11-17 起是 https://socrates.ray-dev.stream：
      # Cloudflare Tunnel（cloudflared → proxy → app），tunnel 與 ray-dev.stream 的 DNS 在同一個 Cloudflare 帳號。
      # （曾用 Windows 端 Tailscale Funnel 經 tailnet 轉入 raynb.tail5fc9fe.ts.net；tunnel 不能用學校帳號下的 ntnu.cc，
      #  因為 cfargotunnel.com 只代理同一帳號內的 DNS 記錄）
      APP_BASE_URL: ${APP_PUBLIC_URL:?設定 .env 的 APP_PUBLIC_URL}
      COOKIE_SECURE: "true"
      # compose 網段（nginx、cloudflared）＋ Funnel 入口節點的 tailnet 位址（/32），.env 的 TRUSTED_PROXIES 覆寫；
      # 後端由右往左跳過受信任代理取得真實來源。不要放整段 100.64.0.0/10，否則 tailnet 內任何裝置都能偽造來源
      # 必填：沒設就不要啟動。預設值若漏掉入口節點，所有學生會共用同一個來源 IP，登入限流會把整班一起鎖住
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:?設定 .env 的 TRUSTED_PROXIES（172.16.0.0/12 加 Funnel 入口節點的 /32）}
      CASCADE_REALTIME_URL: ws://cascade:8110/v1/realtime
      # 語音訊息的 STT：沿用 NPU 上的 Whisper（OpenAI 相容的 /v1/audio/transcriptions）
      OPENAI_STT_BASE_URL: http://cascade-whisper:8101/v1

  proxy:
    restart: unless-stopped
    # 127.0.0.1 給本機測試；tailnet 位址給 Windows 端的 Funnel（http://${PROXY_TAILNET_IP}:3080）。不綁 0.0.0.0（宿舍網路內其他人不該連到）
    ports: !override
      - "127.0.0.1:${PROXY_PORT:-3080}:80"
      - "${PROXY_TAILNET_IP:-100.71.164.60}:${PROXY_PORT:-3080}:80"

volumes:
  pgdata_v2:
  # 重用測試堆疊已下載的模型與編譯快取（磁碟只剩幾 GB，不複製）
  cascade_hf:
    name: socrates-intel-test_cascade_hf
  cascade_cache:
    name: socrates-intel-test_cascade_cache
