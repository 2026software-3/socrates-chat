# NTNU 正式環境在 msi_cubi 上的疊加檔。
# 使用（在 /var/lib/socrates-prod；日常部署走自動部署，見 docs/ntnu-ops.md §4）：
#   F="-f docker-compose.yml -f docker-compose.intel.yml -f docker-compose.msi-prod.yml -f docker-compose.tunnel.yml"
#   docker compose $F --profile app --profile cascade --profile proxy --profile tunnel up -d --no-build
# .env 不進版控；.env 要有 CASCADE_INTEL_TAG、APP_IMAGE_TAG、CLOUDFLARE_TUNNEL_TOKEN、CASCADE_LLM_TOKEN。
# 沒有 DEMO_MODE（測試堆疊的 browser-test/compose.yml 才有，不可對公網開放）。
# 資料庫放命名 volume pgdata_v2；舊的 socrates-ntnu_pgdata 留作退路，不要 down -v。
name: socrates-ntnu

services:
  db:
    ports: !override []
    volumes: !override
      - pgdata_v2:/var/lib/postgresql/data
    restart: unless-stopped
  app:
    image: socrates-ntnu-app:${APP_IMAGE_TAG:?設定 APP_IMAGE_TAG}
    build: !reset null
    restart: unless-stopped
    environment:
      # 學生實際開啟的網址，也是 CSRF Origin 檢查的對象（只認這一個）。目前是 https://se3socrateschat.ntnu.cc：
      # 學校 DNS 的 CNAME → socrates.ray-dev.stream（Cloudflare for SaaS 自訂主機名稱，fallback origin 也是它）
      # → Cloudflare Tunnel（cloudflared → proxy → app）。tunnel 與 ray-dev.stream 在同一個 Cloudflare 帳號；
      # tunnel 不能直接用學校帳號下的 ntnu.cc（cfargotunnel.com 只代理同一帳號內的 DNS 記錄），所以才用 SaaS 自訂主機名稱。
      # 備用網址 https://socrates.ray-dev.stream 也能到同一個服務，但寫入請求會因 Origin 不符被 CSRF 擋掉。
      APP_BASE_URL: ${APP_PUBLIC_URL:?設定 .env 的 APP_PUBLIC_URL}
      COOKIE_SECURE: "true"
      # compose 網段（proxy、cloudflared），由 .env 的 TRUSTED_PROXIES 設定（目前 172.16.0.0/12）；
      # 後端由右往左跳過受信任代理取得 Cloudflare 帶來的真實來源。不要放整段 100.64.0.0/10，否則 tailnet 內任何裝置都能偽造來源
      # 必填：沒設就不要啟動。漏掉代理所在網段時，所有學生會共用同一個來源 IP，登入限流會把整班一起鎖住
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:?設定 .env 的 TRUSTED_PROXIES（compose 網段 172.16.0.0/12）}
      CASCADE_REALTIME_URL: ws://cascade:8110/v1/realtime
      # 語音訊息的 STT：沿用 NPU 上的 Whisper（OpenAI 相容的 /v1/audio/transcriptions）
      OPENAI_STT_BASE_URL: http://cascade-whisper:8101/v1

  proxy:
    restart: unless-stopped
    # 對外流量走 cloudflared → proxy:80（compose 網路內），不經這兩個埠。127.0.0.1 給本機測試；tailnet 位址給 tailnet 內的裝置測試
    # （http://${PROXY_TAILNET_IP}:3080）。不綁 0.0.0.0（宿舍網路內其他人不該連到）
    ports: !override
      - "127.0.0.1:${PROXY_PORT:-3080}:80"
      - "${PROXY_TAILNET_IP:-100.71.164.60}:${PROXY_PORT:-3080}:80"

volumes:
  pgdata_v2:
  # 重用測試堆疊已下載的模型與編譯快取（磁碟只剩幾 GB，不複製）。這兩個卷是測試堆疊建的，所以宣告成 external：
  # 否則每次 docker compose 都會警告「卷屬於專案 socrates-intel-test」。external 的卷不由 compose 建立或刪除。
  cascade_hf:
    name: socrates-intel-test_cascade_hf
    external: true
  cascade_cache:
    name: socrates-intel-test_cascade_cache
    external: true
