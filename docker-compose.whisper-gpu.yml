# cascade-whisper 改跑 NVIDIA GPU（faster-whisper small、int8_float16）。疊在 docker-compose.yml 之上，預設不套用：
#   docker compose -f docker-compose.yml -f docker-compose.whisper-gpu.yml --profile cascade up -d --build
# 需要 NVIDIA Container Toolkit。實測（RTX 4050 Laptop）：單一請求辨識約 1.3 s → 0.27 s，兩個同時 2.6 s → 0.65 s，
# 字錯率沒有變差，GPU 顯存多約 420 MiB（docs/specs/cascade-slimming.md）。
services:
  cascade-whisper:
    build:
      args:
        WHISPER_GPU: "1"
    image: socrates-cascade-whisper:gpu
    environment:
      WHISPER_DEVICE: cuda
      WHISPER_COMPUTE: int8_float16
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
