[package]
name = "socrates-chat-backend"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
openidconnect = "4.0.1"
rand = "0.10.3"
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "uuid", "chrono", "json"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
futures-util = "0.3.34"
tokio-stream = "0.1.19"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "multipart"] }
tower-http = { version = "0.7.1", features = ["fs"] }
tower = { version = "0.5.3", features = ["util"] }
argon2 = "0.6.0"
utoipa = { version = "6.0.0", features = ["uuid", "chrono"] }
utoipa-redoc = { version = "7.0.0", features = ["axum"] }
regex = "1.13.1"
tower_governor = { version = "0.8.0", default-features = false, features = ["axum"] }

[dev-dependencies]
dotenvy = "0.15.7"
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }

# 測試（繼承 dev profile）裡每次 Argon2 雜湊在未最佳化下要數秒，拖慢所有登入相關測試
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
